[project]
name = "mcp-pdf"
version = "2026.09.21.1"
description = "Secure FastMCP server for comprehensive PDF processing - text extraction, OCR, table extraction, forms, annotations, and more"
authors = [{name = "Ryan Malloy", email = "ryan@supported.systems"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = [
    "mcp", 
    "fastmcp", 
    "pdf", 
    "ocr", 
    "text-extraction",
    "table-extraction",
    "pdf-processing",
    "api",
    "integration"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
    "Topic :: Office/Business",
]
dependencies = [
    # >=0.1.0 was a fiction: this package imports fastmcp.contrib.mcp_mixin,
    # which does not exist before 2.x, so a resolver could legally pick a
    # version where the server cannot import at all. 2.11.2 and 4.0.5 are both
    # verified; the tool-listing API differs between them and tests span both.
    "fastmcp>=2.11.2",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "PyMuPDF>=1.24.3",  # 1.24.3 introduced the pymupdf module name
    "pdfplumber>=0.10.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
    "pypdf>=6.0.0",
    "pandas>=2.0.0",
    "Pillow>=10.0.0",
    "markdown>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/rsp2k/mcp-pdf"
Documentation = "https://github.com/rsp2k/mcp-pdf#readme"
Repository = "https://github.com/rsp2k/mcp-pdf.git"
Issues = "https://github.com/rsp2k/mcp-pdf/issues"
Changelog = "https://github.com/rsp2k/mcp-pdf/blob/main/CHANGELOG.md"

[project.scripts]
mcp-pdf = "mcp_pdf.server:main"

[project.optional-dependencies]
# Form creation features (create_form_pdf, advanced form tools)
forms = [
    "reportlab>=4.0.0",
]

# Advanced table extraction (camelot needs Ghostscript, tabula needs Java)
tables = [
    "camelot-py[cv]>=0.11.0",
    "tabula-py>=2.8.0",
]

# Markdown → PDF conversion (requires pandoc binary + a PDF engine such as
# xelatex, pdflatex, tectonic, weasyprint, or wkhtmltopdf)
markdown = [
    "pypandoc>=1.13",
]

# All optional features
all = [
    "reportlab>=4.0.0",
    "camelot-py[cv]>=0.11.0",
    "tabula-py>=2.8.0",
    "pypandoc>=1.13",
]

# Development dependencies, for `pip install mcp-pdf[dev]`.
# NOTE: [dependency-groups].dev below is the list `uv sync --dev` actually
# uses. These two have drifted apart before; keep the shared pins aligned.
# twine must be >=7 because hatchling emits Metadata-Version 2.5, which
# twine 6.x rejects with "'2.5' is not a valid metadata version".
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "build>=0.10.0",
    "twine>=7.0.0",
    "safety>=3.2.11",
    "pip-audit>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Keep dev-only artifacts out of the sdist that ships to PyPI.
# (The PII audit also runs against the unpacked sdist before each publish —
# see ~/.claude/rules/python.md.)
[tool.hatch.build.targets.sdist]
# force-include re-adds files that gitignore (e.g. `*.pdf`) would otherwise
# block — the fixture under tests/fixtures/ is small, deliberate, and required
# by tests/test_xfa.py at runtime. Unlike `include`, force-include is additive,
# not restrictive.
force-include = {"tests/fixtures/xfa/synthetic_dynamic_xfa.pdf" = "tests/fixtures/xfa/synthetic_dynamic_xfa.pdf"}
exclude = [
  "CLAUDE.md",          # operator-private project context
  ".env", ".env.local", # never ship credentials
  ".mcp.json",          # contains local filesystem paths
  ".pytest_cache/",
  ".ruff_cache/",
  "build/",
  "dist/",
  "examples/page_001.png",
  "examples/*.pdf",     # demo PDFs are large + not needed by end users
  "tests/CopperSprings_DigitalPortfolio.pdf",  # large fixture PDF
  "**/page_*.png",      # convert_to_images output artifacts (test side-effects)
  "docs/agent-threads/",   # project coordination history, not for end users
  "test_security_features.py",
  "test_integration.py",
  "MCP_DOCX_TOOLS_PLAN.md",
  "claude-mcp-manager", # personal helper script
  "run-mcp-server.sh",
  "docker-compose.yml",
  "Dockerfile",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-v --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[dependency-groups]
dev = [
    "pip-audit>=2.9.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "reportlab>=4.4.3",
    "safety>=3.2.11",
    "twine>=7.0.0",
]
